<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupni chat</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#ffffff; --text:#1a1a1a; --muted:#6b6b70;
    --bubble-me:#2563eb; --bubble-me-text:#ffffff;
    --bubble-other:#eef0f3; --bubble-other-text:#1a1a1a;
    --border:#e4e4e7; --accent:#2563eb;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100%;
  }
  header{
    padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  header h1{ font-size:16px; margin:0; font-weight:600; }
  #status{ font-size:12px; color:var(--muted); }
  #messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:75%; display:flex; flex-direction:column; gap:2px; }
  .msg.me{ align-self:flex-end; align-items:flex-end; }
  .msg.other{ align-self:flex-start; align-items:flex-start; }
  .msg .name{ font-size:11px; padding:0 4px; font-weight:600; }
  .bubble{ padding:8px 12px; border-radius:16px; font-size:14px; line-height:1.4; word-wrap:break-word; white-space:pre-wrap; }
  .msg.me .bubble{ background:var(--bubble-me); color:var(--bubble-me-text); border-bottom-right-radius:4px; }
  .msg.other .bubble{ background:var(--bubble-other); color:var(--bubble-other-text); border-bottom-left-radius:4px; }
  .msg .time{ font-size:10px; color:var(--muted); padding:0 4px; }
  .system{ align-self:center; font-size:12px; color:var(--muted); padding:4px 10px; }
  #online-bar{
    display:none; align-items:center; gap:8px; flex-wrap:wrap;
    padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    font-size:12px; color:var(--muted); flex-shrink:0;
  }
  #online-bar .online-label{ font-weight:600; color:var(--text); }
  .online-pill{
    display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px;
    border-radius:12px; background:var(--bg); border:1px solid var(--border); color:var(--text);
  }
  .online-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  #empty{ margin:auto; color:var(--muted); font-size:13px; text-align:center; }
  form{ display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
  input[type=text]{ flex:1; padding:10px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:14px; outline:none; }
  input[type=text]:focus{ border-color:var(--accent); }
  button{ background:var(--accent); color:#fff; border:none; border-radius:20px; padding:0 18px; font-size:14px; font-weight:600; cursor:pointer; }
  button:disabled{ opacity:.5; cursor:default; }

  #join-screen{
    position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px;
  }
  #join-screen h2{ margin:0; }
  #join-screen input{ padding:12px 16px; border-radius:10px; border:1px solid var(--border); font-size:16px; width:260px; max-width:80vw; }
  #join-screen button{ padding:12px 24px; border-radius:10px; }
</style>
</head>
<body>

<div id="join-screen">
  <h2>💬 Grupni chat</h2>
  <input id="name-input" type="text" placeholder="Tvoje ime" maxlength="30" autocomplete="off">
  <button id="join-btn">Uđi u chat</button>
  <div id="join-status" style="color:var(--muted); font-size:13px;"></div>
</div>

<header style="display:none;" id="chat-header">
  <h1>💬 Grupni chat</h1>
  <div id="status">Povezivanje…</div>
</header>
<div id="online-bar"><span class="online-label">Online:</span><span id="online-list"></span></div>
<div id="messages" style="display:none;"><div id="empty">Još nema poruka. Budi prvi/a!</div></div>
<form id="form" style="display:none;">
  <input id="input" type="text" placeholder="Napiši poruku…" autocomplete="off" maxlength="2000">
  <button id="send" type="submit">Pošalji</button>
</form>

<script>
// === PROMIJENI OVO nakon deploya na Render (wss://tvoj-servis.onrender.com) ===
const SERVER_URL = "wss://PROMIJENI-OVO.onrender.com";

const joinScreen = document.getElementById('join-screen');
const nameInput = document.getElementById('name-input');
const joinBtn = document.getElementById('join-btn');
const joinStatus = document.getElementById('join-status');

const chatHeader = document.getElementById('chat-header');
const onlineBar = document.getElementById('online-bar');
const onlineList = document.getElementById('online-list');
const messagesEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty');
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const input = document.getElementById('input');

let ws = null;
let myName = null;

function fmtTime(ts){
  try{
    return new Date(ts).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  }catch(e){ return ''; }
}

function clearEmpty(){
  if(emptyEl.parentNode) emptyEl.remove();
}

function addChatMessage(m){
  clearEmpty();
  const isMe = m.name === myName;
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (isMe ? 'me' : 'other');

  if(!isMe){
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.style.color = m.color || 'inherit';
    nameEl.textContent = m.name || 'Netko';
    wrap.appendChild(nameEl);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = m.text || '';
  wrap.appendChild(bubble);

  const timeEl = document.createElement('div');
  timeEl.className = 'time';
  timeEl.textContent = fmtTime(m.ts);
  wrap.appendChild(timeEl);

  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function renderOnlineUsers(users){
  onlineList.innerHTML = '';
  users.forEach(function(u){
    const pill = document.createElement('span');
    pill.className = 'online-pill';
    const dot = document.createElement('span');
    dot.className = 'online-dot';
    dot.style.background = u.color || '#888';
    pill.appendChild(dot);
    pill.appendChild(document.createTextNode(u.name));
    onlineList.appendChild(pill);
  });
}

function addSystemMessage(text){
  clearEmpty();
  const el = document.createElement('div');
  el.className = 'system';
  el.textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function connect(name){
  myName = name;
  ws = new WebSocket(SERVER_URL);

  ws.onopen = function(){
    ws.send(JSON.stringify({ type: 'join', name: name }));
    statusEl.textContent = 'Povezano';
    input.disabled = false;
    document.getElementById('send').disabled = false;
    input.focus();
  };

  ws.onmessage = function(event){
    let msg;
    try{ msg = JSON.parse(event.data); } catch(e){ return; }

    if(msg.type === 'history'){
      msg.messages.forEach(addChatMessage);
    } else if(msg.type === 'chat'){
      addChatMessage(msg);
    } else if(msg.type === 'system'){
      addSystemMessage(msg.text);
    } else if(msg.type === 'users'){
      renderOnlineUsers(msg.users);
    }
  };

  ws.onclose = function(){
    statusEl.textContent = 'Veza prekinuta — pokušavam ponovno…';
    input.disabled = true;
    document.getElementById('send').disabled = true;
    setTimeout(function(){ connect(myName); }, 2000);
  };

  ws.onerror = function(){
    statusEl.textContent = 'Greška u vezi';
  };
}

joinBtn.addEventListener('click', function(){
  const name = nameInput.value.trim();
  if(!name){
    joinStatus.textContent = 'Upiši ime prije ulaska.';
    return;
  }
  joinScreen.style.display = 'none';
  chatHeader.style.display = 'flex';
  onlineBar.style.display = 'flex';
  messagesEl.style.display = 'flex';
  form.style.display = 'flex';
  connect(name);
});

nameInput.addEventListener('keydown', function(e){
  if(e.key === 'Enter') joinBtn.click();
});

form.addEventListener('submit', function(e){
  e.preventDefault();
  const text = input.value.trim();
  if(!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ type: 'chat', text: text }));
  input.value = '';
  input.focus();
});
</script>
</body>
</html>
